name: fairprice
description: FairPrice / BirrWise — Crowdsourced Product Price Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  firebase_analytics: ^11.2.1
  firebase_storage: ^12.1.3

  # State management
  provider: ^6.1.1

  # UI / Charts
  fl_chart: ^0.68.0
  shimmer: ^3.0.0

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Barcode scanner
  mobile_scanner: ^5.2.3

  # Location
  geolocator: ^11.0.0

  # Local storage
  shared_preferences: ^2.2.2

  # Image picker
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.0
  uuid: ^4.3.3
  timeago: ^3.6.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true